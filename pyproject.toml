[project]
name = "fabrica-videos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "edge-tts>=7.2.8",
    "fal-client>=1.0.1",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
fabrica = "fabrica.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabrica"]
