# Configuração geral da fábrica. Cada canal tem seu perfil na pasta perfis.

precos:                                # usados só para estimar o gasto, atualize quando mudarem
  genaipro_por_mil_caracteres: 0.022   # narração na GenAIPro, US$ 22 por 1 milhão de créditos (1 crédito por caractere)
  imagem: 0.067                        # Nano Banana 2 direto no Google em 1K (2K custa 0.101)
  imagem_lote: 0.034                   # a mesma imagem pelo modo lote do Google, metade do preço
  imagem_kie: 0.02                     # Grok Imagine 2.0 via Kie.ai
  imagem_openrouter: 0.005             # GPT-5.4 Image 2 em qualidade baixa pelo OpenRouter, medido (o Grok por lá: 0.04)
  efeito_por_minuto: 0.12              # efeitos sonoros da ElevenLabs direta (opcional), por minuto de som gerado
  claude_entrada_por_milhao: 5.00
  claude_saida_por_milhao: 25.00
  claude_escolha_por_cena: 0.02        # Claude olhando as fotos e vídeos candidatos de uma cena
  correcao_por_cena: 0.0005            # conferir uma cena: o modelo de visão descreve e o Jev julga
  gemini_entrada_por_milhao: 0.75      # gemini-3.8-flash: tokens lidos
  gemini_saida_por_milhao: 3.75        # tokens escritos, o pensamento conta aqui
  mimo_entrada_por_milhao: 0            # agente pelo modelo principal (Gemma gratuito)
  mimo_saida_por_milhao: 0
  agente_entrada_por_milhao: 0.15       # agente pelo roteirista.modelo (DeepSeek V4 Flash). A tabela diz 0,03 e 0,06, mas
  agente_saida_por_milhao: 1.5          # o OpenRouter cobrou uns US$ 0,01 por lote (medido no Tsavo: US$ 0,22 por 8,5 min)

# O que você paga pela narração, para saber quanto cada vídeo consome. O preço por caractere sai de
# preco_mensal / incluido_no_mes, e é ele que entra na conta do vídeo. Deixe preco_mensal em 0 para
# usar a tarifa avulsa de precos acima.
assinaturas:
  genaipro:
    plano: GenAIPro 1 milhão          # só para aparecer no relatório
    preco_mensal: 22.00                # US$ pagos pelo pacote
    incluido_no_mes: 1000000           # créditos do pacote (US$ 0,000022 por crédito)

# Voz grátis: Fish Audio pelo OpenRouter, no lugar do Edge-TTS (perfil ou editor com voz.provedor: fish e o código
# da voz da biblioteca da Fish em voz.voice_id). O tempo de cada palavra vem da transcrição (uns centavos por vídeo,
# precisa de US$ 0,50 de saldo no OpenRouter); sem ela, é estimado pelas pausas do áudio
fish:
  modelo: fish-audio/s2.1-pro-free:free
  transcricao: openai/whisper-large-v3-turbo
  blocos_ao_mesmo_tempo: 3

# Narração. A chave fica no .env, em GENAIPRO_API. O saldo aparece no editor e em uv run fabrica creditos.
genaipro:
  url: https://genaipro.io/api
  # créditos gastos por caractere. NÃO é 1: o saldo mostrou 676 créditos para 10.543 caracteres (turbo v2.5).
  # Cada narração mede o saldo antes e depois e a média medida (genaipro_medido.json) passa a valer no lugar deste
  creditos_por_caractere: 0.064

cenas:
  provedor: groq              # ignorado: cenas, textos e buscas usam openrouter.modelo_principal
  reserva: gemini             # entra sozinho quando o Groq falha ou a cota de 24h enche. groq, gemini ou vazio

gemini:
  modelo: gemini-3.8-flash    # US$ 0,75 por milhão de tokens lidos e US$ 3,75 por milhão escritos (pensamento conta como escrito)
  modelo_visao: gemini-3.8-flash  # olha as miniaturas ao escolher material real. gemini-3.1-flash-lite sai bem mais barato
  tokens_por_minuto: 8000    # limite do plano gratuito por conta. A reserva para a resposta sai daqui
  saida_minima: 700          # abaixo disso o pedido é grande demais e quem chamou divide em dois
  raciocinio: low             # minimal, low, medium ou high. O pensamento conta como token escrito e era 60% do gasto
  cenas_por_lote: 20
  tentativas: 6

corrigir:
  provedor: jev            # jev: o modelo de visão descreve a imagem e o Jev julga (muito mais barato).
                           # openrouter/groq/gemini: um modelo de visão só olha e julga de uma vez
  modelo_descricao: mimo   # quem descreve as imagens para o Jev: openrouter.modelo_principal
  modelo_descricao_reserva: gemini  # entra sozinho quando o MiMo e a cota do Groq falham
  cenas_por_descricao: 1   # cenas por chamada ao descrever. Mais que 1 e o modelo troca as legendas entre elas
  cenas_por_chamada: 5    # cenas conferidas numa chamada só. 1 gasta mais, porque repete as instruções
  automatico: true         # roda sozinho no "tudo", depois do acervo e antes das imagens de IA
  rodadas: 3               # vezes que tenta outro material real numa cena que não combina
  nota_para_trocar: 20     # abaixo disso o sistema troca sozinho. Entre este e o nota_minima ele só aponta
  nota_minima: 40          # no jev a nota é a probabilidade do Jev, que fica mais baixa: 55 pega o que está errado
                           # mesmo. Nos outros provedores, que dão nota de 0 a 100, use 80
  modelo:                  # só nos provedores groq/gemini/openrouter. Vazio usa o modelo de visão do provedor

# Quem descreve as imagens das cenas para o Jev julgar (corrigir._pelo_gemini), no site e no TipLabs. Pedido do usuário
# em 2026-10-10: o Gemini Flash-Lite faz todo esse trabalho, sem pensar e com miniatura. O 2.5 Flash-Lite o Google não
# libera mais para chave nova (404), então vai o 3.1 (US$ 0,25 e 1,50 por milhão de tokens): numa foto, 1,7 s, 856
# tokens lidos e 157 escritos, uns US$ 0,0005. Sem resposta dele, a cadeia de visão (midia.modelos_visao) descreve.
# modelo vazio volta ao jeito antigo (os gratuitos primeiro).
descricao:
  modelo: gemini-3.1-flash-lite
  raciocinio: minimal      # sem pensar: o pensamento é cobrado como escrita
  resolucao: baixa         # baixa, media ou alta: na baixa a imagem gasta metade dos tokens (856 contra 1.692)
  lado: 512                # maior lado da miniatura enviada, em pixels
  max_tokens: 600          # a resposta de uma cena tem uns 160 tokens

# O OpenRouter serve só para falar com o Jev, que não tem API própria. Todo o resto roda no Groq, com o
# Gemini de reserva: o roteador jev-router escolhe modelos caros sozinho (já chegou a usar o Claude Sonnet).
openrouter:
  modelo: typesafe/jev-router   # usado só se alguma etapa chamar o OpenRouter sem dizer o modelo
  tentativas: 5
  max_tokens: 10000             # espaço para a resposta de um lote de 20 cenas, mais o raciocínio do modelo
  max_tokens_teto: 24000
  # modelo de texto e de visão de TODA a fábrica (agente, cenas, textos na tela, escolha das fotos, descrição das
  # imagens). MiMo, Groq e Gemini não são mais usados. O Jev continua sendo o juiz.
  modelo_principal: groq:qwen/qwen3.8-27b
  # os principais, em ordem: quando um não atende (sem saldo, limite do dia dos gratuitos, retirado do ar), a
  # chamada passa na hora para o seguinte, e ele fica de lado um tempo. "aimlapi:" na frente vai pela AIMLAPI
  # (chave aimlapi_api no .env). Em 5/10/2026 o Space Bunny saiu do OpenRouter (404) e o Qwen 27B deixou de ser
  # gratuito: a cadeia passou a ser o Gemma 4 31B gratuito (enxerga imagem) e o Qwen Flash pago. Os gratuitos têm
  # 1.000 chamadas por dia na conta (um vídeo usa de 1.200 a 2.300). Pedido do usuário em 2026-10-05: o máximo de
  # API gratuita. "groq:" na frente vai pelo Groq, revezando as GROQ_API_KEY do .env (11 hoje, cada uma com 1.000
  # pedidos por dia e 8.000 tokens por minuto); o Qwen 27B de lá enxerga imagem. Os gratuitos do OpenRouter vêm
  # depois, e o pago só no fim. Pedido com imagem pula quem está em so_texto
  principais:
    - groq:qwen/qwen3.8-27b
    - groq:openai/gpt-oss-120b
    - google/gemma-4-31b-it:free
    - dots-studio/dots-3-note-preview:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/free           # o roteador do OpenRouter escolhe um gratuito que esteja de pé
    - qwen/qwen3.8-flash        # última reserva, PAGA (US$ 0,15 e 0,47 por milhão de tokens; uns US$ 0,80 por vídeo
                                # se fizer tudo): só entra quando os gratuitos acabam (o limite de 1.000 chamadas por dia
                                # vale para a conta inteira) ou saem do ar. É o mais barato que enxerga imagem
  espera_pelo_gratis: 60         # antes de pagar, espera até isso (s) por um gratuito que está fora só pelo limite do
                                # minuto. Um pico da conferência mandou 27 descrições para o Qwen pago em 1 min
  confirmar_pago: true           # modelo de texto pago só depois de TODOS os gratuitos esgotarem e com a confirmação
                                # da pessoa (no editor ou no terminal), liberado por projeto até o fim do dia
                                # (pago.py). Em 05/10 o Qwen pago escolhendo fotos custou US$ 2,59 sem ninguém saber
  so_texto:                      # quem não enxerga imagem: pedido com imagem pula estes
    - groq:openai/gpt-oss
    - nvidia/nemotron-3-super
    - nvidia/nemotron-3-ultra
    - nvidia/nemotron-3.5-lightning
  raciocinio_por_modelo:         # esforço de raciocínio só onde o modelo aceita: nenhum, low, medium ou high
    dots-studio/: nenhum        # o Dots pensava 7 mil tokens e levava 99 s numa escolha de fotos; sem pensar, 25 s
    xiaomi/mimo: nenhum         # com o raciocínio ligado, alguns lotes de cenas gastavam tudo pensando e voltavam vazios
    stealth/: low               # modelos stealth pensam antes de responder (o Space Bunny gastava tudo pensando)
    qwen/: low                  # o Qwen Flash estourava os 10 mil tokens pensando na busca das cenas cortadas e refazia
                                # com 24 mil, minutos cada (nunca-deve-ter-dentro-de-casa-parte-2, 2026-10-05)
    deepseek/: low              # o DeepSeek V4 Flash pensava uns 8 mil tokens por lote de cenas, levava 30 min para um vídeo de
                                # 8 min e às vezes estourava o limite só pensando

groq:
  modelo: openai/gpt-oss-120b  # aceita esquema JSON estrito. Alternativa: llama-3.3-70b-versatile
  raciocinio: medium         # low, medium ou high, só nos modelos gpt-oss
  tokens_por_minuto: 8000    # limite do plano gratuito, por conta. O Groq conta a reserva da resposta aqui dentro
  max_tokens: 3000           # reserva da resposta. Com 8000, cada escolha de fotos ocupava o minuto inteiro da chave,
                             # as 11 chaves saturavam na criação e a escolha caía no Qwen pago (2026-10-05)
  saida_minima: 700          # se sobrar menos que isso para a resposta, o pedido é dividido em dois
  modelo_visao: qwen/qwen3.8-27b  # olha as miniaturas ao escolher material real
  cenas_por_lote: 20         # cenas decididas por chamada. Menos cenas gasta menos do limite por minuto
  contexto_antes: 3          # cenas anteriores mostradas só para dar contexto
  contexto_depois: 2         # cenas seguintes mostradas só para dar contexto

ia:
  ativa: true                # cena que não existe em foto ou que veio errada recebe imagem de IA, obrigatoriamente e
                             # sem teto (conferida pelo Jev). false: vídeo só com banco de imagens, nenhuma IA

roteirista:
  # O agente de roteiro lê o roteiro inteiro (fabrica mapa) e decide as cenas bloco a bloco, com o assunto
  # de cada bloco e as armadilhas de busca. Os cortes de 3 a 5 segundos continuam sendo os do código.
  # Não entra em perfis com personagem ou com efeitos sonoros, que seguem pelo caminho antigo.
  ativo: true
  provedor: openrouter       # openrouter: o modelo de roteirista.modelo, com a cadeia de principais de reserva.
                             # mimo: só a cadeia de principais. claude: o Claude da assinatura (não usar na fábrica)
  # agente de roteiro (mapa e cenas) e diretor do Corrigir, em cadeia, e depois a cadeia de principais. Pedido do
  # usuário em 2026-10-05, o máximo de gratuito: o Nemotron Ultra gratuito na frente, o DeepSeek pago de reserva.
  # Comparados com o mesmo pedido em 3 lotes reais, ele foi igual ou melhor e não estourou o limite pensando
  modelos:
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - deepseek/deepseek-v4-flash
  modelo: deepseek/deepseek-v4-flash  # (antigo, vale sem a lista acima) Medido no roteiro de
                             # Tsavo (8,5 min): uns US$ 0,22 por vídeo, cerca de US$ 0,01 por lote de cenas
  esforco_claude: medium     # low, medium ou high: quanto o Claude pensa em cada lote de cenas
  cenas_por_lote: 10         # trechos por chamada. O mapa e o perfil vão juntos e ocupam boa parte do limite do Groq
  paralelo: 4                # blocos do roteiro decididos ao mesmo tempo. Cada pedido ao MiMo leva uns 20 segundos

claude:
  via: assinatura           # assinatura usa o Claude Code do Mac. api usa créditos da ANTHROPIC_API_KEY
  modelo_assinatura: opus    # opus ou sonnet, pela assinatura
  modelo: claude-opus-5      # usado só quando via for api
  esforco: high              # planejamento das cenas. low, medium, high, xhigh ou max
  esforco_escolha: medium    # escolha entre fotos e vídeos candidatos
  unidades_por_lote: 120     # frases enviadas por chamada
  processos: 2               # chamadas ao Claude ao mesmo tempo

midia:
  escolha: mimo            # quem escolhe as fotos: a cadeia de visão (modelos_visao, abaixo)
  # quem olha as imagens (escolha das fotos, descrição para o Jev, revisão do vídeo pronto): os gratuitos que enxergam
  # imagem primeiro, o pago só de reserva e sem raciocínio. Pedido do usuário em 2026-10-05: a escolha das fotos do
  # nunca-deve-ter-dentro-de-casa-parte-2 (30 min) caiu toda no Qwen pago e custou US$ 2,44. Medido na cena 7 do
  # natureza-teste-1min: o Dots sem raciocínio escolhe em 25 s, de graça; o Qwen sem raciocínio, uns US$ 0,001
  modelos_visao:
    - groq:qwen/qwen3.8-27b     # 11 chaves do Groq, 1,1 s por folha de candidatos
    - dots-studio/dots-3-note-preview:free
    - google/gemma-4-31b-it:free
    - google/gemma-4-26b-a4b-it:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free   # descreve bem; na escolha às vezes não escolhe nada
    - openrouter/free
    # o pago de reserva: teste de bancada de 2026-10-07 (98 folhas do mcp-cafe-5min contra a escolha do Claude), a 1ª
    # foto entre as que o Claude aceitou: qwen3.7-flash 78% a US$ 0,00008 por folha, qwen3-vl-32b 64% a US$ 0,00026,
    # qwen3.8-flash 62% a US$ 0,00033. O 3.7 quase sempre escolhe alguma foto quando nada serve (3 de 10 recusas
    # certas); a conferência do Jev, depois do download, troca a que mostra outra coisa
    # Desde 2026-10-09, a pedido do usuário, o pago de reserva é o Gemini 3.1 Flash-Lite (o mesmo do MCP), no lugar
    # do Qwen 3.7 Flash; o Qwen fica só para o Gemini fora do ar, para a escolha nunca parar.
    - gemini:gemini-3.1-flash-lite
    - qwen/qwen3.7-flash
  raciocinio_visao:
    dots-studio/: nenhum
    qwen/: nenhum
    nvidia/: nenhum
  reserva: gemini          # entra sozinho quando a cota de 24 horas do Groq acaba no meio da escolha
  conferir_na_captura: true  # o Jev confere cada candidato antes de baixar, pela frase que o modelo escreveu do que vê nele.
                           # Sem custo de visão a mais: a frase sai da mesma chamada da escolha. false volta ao jeito antigo
  nota_minima_captura: 30    # abaixo disso o candidato é descartado e o próximo da lista é testado
  candidatos_conferidos: 3   # quantos candidatos testar por cena. Se nenhum passar, fica o de maior nota, sob suspeita
  contato: "jonathansantost99@gmail.com"   # o Wikimedia só libera buscas com um contato no pedido
  processos: 4               # cenas buscando material real ao mesmo tempo
  escolhas_ao_mesmo_tempo: 4 # lotes de 6 cenas escolhidos e conferidos ao mesmo tempo pelo modelo principal e pelo Jev
  candidatos: 12             # fotos ou vídeos mostrados ao modelo por cena (com 9 bancos, 8 era pouco)
  cenas_por_escolha: 6       # cenas mostradas ao Claude em cada rodada de escolha
  espera_maxima: 3600        # segundos que a fábrica espera quando uma fonte atinge o limite de buscas

imagens:
  lote: true                 # manda as imagens em lote ao Google, metade do preço, pronto em minutos ou horas
  minimo_lote: 8             # com menos imagens que isso gera na hora, como no refazer
  espera_lote_horas: 24
  processos: 6               # imagens de IA geradas ao mesmo tempo, fora do lote
  tentativas: 3

render:
  largura: 1920
  altura: 1080
  fps: 30
  superamostragem: 3         # maior deixa o movimento mais suave e o render mais lento
  zoom_maximo: 1.12
  crf: 18                    # menor dá mais qualidade e arquivo maior
  processos: 0               # 0 usa metade dos núcleos do Mac

jev:
  julgar_com: jev             # jev: o juiz da TypeSafe pelo OpenRouter (pago, uns US$ 0,00005 por cena).
                              # principal: o modelo principal julga as mesmas perguntas (hoje gratuito). Para usar
                              # só num processo, sem mexer no servidor no ar: FABRICA_JULGAR_COM=principal

# Animações das cenas de diagrama, texto na tela, linha do tempo e mapa (HyperFrames, roda no PC, gratuito).
# Precisa do Node.js 22 ou mais (nodejs.org). Sem ele, ou com ativo: false, essas cenas seguem com foto.
animacoes:
  ativo: true
  versao: 0.8.113             # versão fixa do HyperFrames: atualização dele não muda vídeo sem aviso
  paralelo: 2                 # cenas animadas ao mesmo tempo (cada uma abre um Chrome escondido)
  tentativas: 3               # pedidos ao modelo quando a animação reprova na conferência
  tipos: [diagrama, texto_tela, linha_do_tempo, mapa]
  # estilo:                   # cores do canal (também dá para pôr no perfil, em animacoes.estilo)
  #   destaque: "#E8A33D"
  #   texto: "#F3EBDD"
  #   escurecer: 0.62          # quanto o material real escurece por trás da animação

# Motion IA (PRD-MOTION.txt): cena que iria para a imagem de IA, ou que tirou nota abaixo de nota_minima no Jev, vira
# um clipe de motion graphics no lugar da foto quando o Jev, lendo o roteiro, dá nota_utilidade ou mais (um dado, uma
# comparação, causa e consequência). Estilo editorial Vox (fundo creme com pontos, cards, linhas SVG, mola). Cena que
# cita um animal ou nome exato leva a própria foto num card; sem foto certa, segue para a imagem de IA. No .env, JEV_MOTION_FALLBACK_ENABLED
# (true/false) e JEV_MIN_SCORE_THRESHOLD (de 0 a 10) valem por cima destes
motion_ia:
  # FORA DA PRODUÇÃO desde 2026-10-09 (pedido do usuário: "vamos tirar da produção o motion ai até ajustar ele"): nenhuma
  # entrada automática (antes da imagem de IA, nota baixa no Corrigir, onde ajuda o roteiro, perfis motion-ai e
  # motion-vox) faz clipe. No lugar dele entra o animation-ai. Para testar o ajuste: fabrica motion NOME --mesmo-pausado
  pausado: true
  ativo: true
  estilo: ""                  # "" (editorial, cards sobre creme) ou "colagem" (jornal envelhecido, estilo Vox: motion_estilo.py).
                              # Vale para todo clipe do Motion IA, também nas cenas de um documentário comum; o perfil troca por canal
  nota_minima: 40             # de 0 a 100, como o Jev da fábrica (o mesmo NOTA_MINIMA_FIXA)
  nota_utilidade: 70          # de 0 a 100: o Jev lê o roteiro e diz se o motion explica a fala melhor que a imagem
  tentativas: 3               # pedidos ao modelo quando o código ou o HyperFrames reprovam o HTML
  paralelo: 2                 # clipes gravados ao mesmo tempo (cada um abre um Chrome escondido)
  max_por_minuto: 15          # pedidos por minuto aos modelos gratuitos
  fps: 30                     # MOTION_RENDER_FPS no .env vale por cima
  # revisão visual antes de gravar: a cadeia de visão (só os gratuitos) olha os quadros e dá nota de 1 a 10 em
  # legibilidade, composição, clareza, fidelidade, movimento e acabamento; abaixo de `nota`, o problema volta para
  # quem fez o clipe, até `rodadas` revisões. Sem passar, fica o de melhor nota se a pior nota dele chegar a `aceitavel`
  critica:
    ativa: true
    nota: 8
    aceitavel: 5
    rodadas: 3
  sons: true                  # pop, risco, contagem e baque no tempo de cada movimento do clipe (feitos em código)
  volume_sons_db: -20         # depois do pico de cada clipe levado a -1 dB; a voz fica em -16 LUFS
  # só gratuitos: o pago da lista é ignorado; vazia, valem os gratuitos de openrouter.principais; OPENROUTER_FREE_MODELS
  # no .env vale por cima. O Nemotron Super só lê texto, e aqui basta: fez a cena 11 do natureza-teste-1min de primeira
  modelos:
    - nvidia/nemotron-3-super-120b-a12b:free
    - groq:openai/gpt-oss-120b
    - groq:qwen/qwen3.8-27b
    - google/gemma-4-31b-it:free

# Revisão do vídeo pronto: depois do render, o modelo principal (gratuito) olha um quadro de cada cena do final.mp4
# e aponta tela preta, imagem que não combina, texto cortado ou por cima da legenda. Só aponta, não troca nada.
revisao_video:
  ativo: true

# Conferência da narração (fabrica/conferir_voz.py): cada bloco gravado é ouvido pelo Whisper do Groq (grátis) e
# conferido com o roteiro: palavra comida, trecho repetido e pronúncia dos termos de pronuncia.json. Com problema, o
# bloco é gravado de novo e fica a melhor gravação. Sem Groq, a narração segue sem a conferência.
conferencia_voz:
  ativo: true
  regravar: 2          # vozes grátis (Fish, Edge): quantas vezes gravar de novo um bloco com problema
  regravar_paga: 1     # GenAIPro: uns US$ 0,004 por bloco regravado
  modelo: whisper-large-v3-turbo

# Cenas animadas de modelos prontos (fabrica/animation_ai.py): COMPLEMENTO das fotos, como o Motion IA. Onde a fala
# tem lista, datas, número, comparação, citação ou documento, o modelo gratuito dá a nota de utilidade e monta a cena
# (19 tipos), com cada item entrando na palavra falada. Roda depois do motion (passo 6b da criação, etapa_motion no
# tudo) ou com fabrica animation-ai NOME. Falhou, a cena fica com a foto.
animation_ai:
  ativo: true
  tema: apple            # apple (o visual do Motion IA: creme, cards brancos, azul), noite, editorial ou misterio
  limiar: 70             # nota de utilidade mínima (0 a 100)
  maximo_do_video: 0.12  # no máximo 12% da duração em cenas animadas (contando os clipes do Motion IA)
  intervalo_minimo: 20   # segundos entre uma cena animada e outra (ou um clipe de motion)
  duracao_maxima: 12     # a frase mais longa que vira uma cena animada
  trechos_por_lote: 6    # frases por pedido ao modelo
  paralelo: 2
  volume_sons_db: -20

# Shorts cortados do vídeo pronto (fabrica/shorts.py), depois de cada render, grátis.
shorts:
  ativo: true
  quantidade: 3
  duracao_minima: 20
  duracao_maxima: 58     # o Shorts aceita até 60 s
  palavras_por_legenda: 3

# Publicação no YouTube (fabrica/youtube_publicar.py). O agendamento é do próprio YouTube (publishAt).
youtube:
  fuso_horas: -3         # a hora do canal (Brasília); o Brasil não tem horário de verão desde 2019
  categoria: "22"        # 22 Pessoas e blogs, 27 Educação, 28 Ciência e tecnologia, 24 Entretenimento
  shorts_intervalo_horas: 24   # cada short sai um dia depois do anterior, a partir do vídeo agendado
  idioma: pt-BR

# Consumo no OpenRouter (fabrica/consumo.py): o endereço público da fábrica (o túnel), por onde o Google Planilhas
# busca o registro (IMPORTDATA). fabrica consumo --google gera o modelo com esse endereço.
consumo:
  url_publica: https://editor.bbnews.cc

# Kit de publicação (fabrica/publicacao.py): publicacao.json e PUBLICACAO.md depois do render, grátis.
publicacao:
  aviso_voz_sintetica: true   # "A narração deste vídeo é feita com voz sintética." no fim da descrição

# Versão em pé (9:16) para Reels e Shorts: fabrica render NOME --vertical (ou "Formato" na janela de renderizar).
# Sai em final_vertical.mp4, com pastas próprias (render_vertical); o vídeo deitado não muda.
vertical:
  largura: 1080
  altura: 1920
  recorte: 1.0                # a foto ou vídeo deitado perde as laterais até ficar quadrado, sobre o fundo desfocado
  # estilo_legenda: "..."     # estilo da legenda só na versão em pé

# Trilha e efeitos compostos pelo modelo principal e tocados pelo código (grátis). Entram quando o perfil não tem
# músicas próprias, ou sempre com substituir: true. fabrica trilha NOME --forcar pede uma partitura nova.
trilha:
  ativo: true
  substituir: false
  volume_db: -16              # volume da trilha gerada (o volume_musica_db do perfil tem prioridade)
  efeitos: true               # passagem, impacto, subida e toque, nos momentos que a partitura e as cenas pedem
  volume_efeitos_db: 0        # ajuste geral dos efeitos gerados

# MCP (o Claude do cliente pensa o vídeo): o cliente só manda o roteiro e recebe o vídeo. Quem vende decide aqui o
# estilo e a voz de todo vídeo do MCP (pedido do usuário em 2026-10-09: "o cliente não deve escolher nada").
mcp:
  perfil: documentario        # documentario (motion editorial onde ajuda) ou documentario-vox (motion em colagem Vox)
  voz: ""                     # vazio: a voz do perfil (GenAIPro, centavos); "fish": a voz grátis da Fish Audio
  perfis: [documentario, documentario-vox]
  # As imagens que o vídeo captura (escolha das fotos, descrição, conferência, revisão) são vistas pela fábrica, não
  # pelo Claude do cliente: o Gemini descreve e escolhe, e o Jev julga a descrição. Tira do cliente o trabalho mais
  # pesado (no ouro-serra-1min, ver imagens foi 63% do consumo dele). Chave: GEMINI_API_KEY no .env (faturamento do
  # AI Studio). Sem a chave, ou com o Gemini fora, a cadeia passa para o Qwen 3.7 Flash pago.
  visao_pela_fabrica: true
  # Desde 2026-10-09 o MCP não usa mais o Claude do cliente para nada: a fábrica pensa tudo sozinha. O cliente manda o
  # roteiro, acompanha a porcentagem e recebe o vídeo, quase sem gastar a assinatura. pelo_cliente: true volta à fila
  # de tarefas respondida pelo Claude dele.
  pelo_cliente: false
  # mapa, cenas, diretor e a orquestradora do Motion IA: vazio segue o caminho de sempre da fábrica, pelo OpenRouter e
  # pelas APIs gratuitas do .env (roteirista.modelos: Nemotron Ultra gratuito, DeepSeek de reserva, depois a cadeia de
  # principais com o Groq). Pedido do usuário em 2026-10-09: o Gemini fica só para ver as imagens.
  modelos_roteiro: []
  raciocinio_roteiro: low
  modelos_texto:                   # trilha, contexto dos blocos, buscas novas e o resto do texto
    - gemini:gemini-3.1-flash-lite
    - qwen/qwen3.7-flash
  raciocinio_gemini: minimal    # sem pensar: o pensamento é cobrado como escrita (108 tokens contra 0, mesma resposta)
  modelos_visao:
    - gemini:gemini-3.1-flash-lite   # o mais barato do Google que responde (US$ 0,25 e 1,50 por milhão de tokens; o
                                     # 2.5-flash-lite aparece na lista mas recusa gerar; o 3.8-flash, US$ 0,75 e 3,75)
    - qwen/qwen3.7-flash
