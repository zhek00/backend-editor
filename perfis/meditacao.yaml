# Perfil da prática guiada. Só áudio, com falas curtas, silêncio longo e música ambiente baixa.
nome: Prática guiada

voz:
  voice_id: COLE_AQUI_O_VOICE_ID       # Aninha, Warm, Calm and Soothing, da biblioteca da ElevenLabs
  modelo: eleven_v3
  estabilidade: 1                      # no v3 os valores aceitos são 0, 0.5 e 1. Em 1 a leitura fica firme e regular
  similaridade: 0.8
  estilo: 0.0
  # tom: "[softly]"                    # tag do v3 colocada antes de cada fala. Teste com um trecho curto antes de usar
  voz_offline: "Reed (Português (Brasil))"

ritmo:
  caracteres_por_minuto: 524           # ritmo medido com a voz v3 do canal

musica: musicas/meditacao              # coloque uma trilha ambiente nessa pasta. Sem áudio lá, o mp3 sai só com a voz
volume_musica_db: -24
