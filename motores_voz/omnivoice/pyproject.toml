[project]
name = "motor-voz-omnivoice"
version = "0.1.0"
description = "Vozes do VoiceStudio (OmniVoice) e do voicebox (Kokoro), rodando na própria fábrica"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "torchaudio>=2.6",
    "omnivoice>=0.2.1",
    "transformers>=5.3.0",
    "accelerate",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile",
    "librosa",
    "pydub",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
